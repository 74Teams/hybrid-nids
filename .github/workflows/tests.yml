name: tests

on:
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # khớp image sensor (scikit-learn 1.9.1 cần Python 3.11+)
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
