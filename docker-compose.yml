networks:
  nids_isolated_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  mysql_db:
    image: mysql:8.0
    container_name: nids_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?đặt trong .env}"
      MYSQL_DATABASE: nids_db
      MYSQL_USER: nids_app
      MYSQL_PASSWORD: "${NIDS_DB_PASSWORD:?đặt trong .env}"
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kênh đẩy tín hiệu "có cảnh báo mới" từ engine/honeypot sang API. Chỉ nằm trong mạng lab (không publish cổng ra host),
  # không lưu bền. Sensor vẫn chạy khi Redis chết nên các service không depends_on nó.
  redis:
    image: redis:7-alpine
    container_name: nids_redis
    command: redis-server --requirepass "${NIDS_REDIS_PASSWORD:?đặt trong .env}" --save "" --appendonly no
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.30
    restart: unless-stopped

  victim_app:
    build: ./lab/victim
    container_name: nids_victim
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.50

  # Image Python dùng chung: chỉ nids_engine build, honeypot và API dùng lại (build 4 lần song song dễ làm Docker Desktop sập).
  nids_engine:
    build: .
    image: hybrid-nids-app
    pull_policy: never
    container_name: nids_engine
    network_mode: "service:victim_app"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      mysql_db:
        condition: service_healthy
      victim_app:
        condition: service_started
    volumes:
      - .:/app
    environment:
      NIDS_DB_HOST: "172.28.0.10"
      NIDS_DB_PORT: "3306"
      NIDS_DB_NAME: "nids_db"
      NIDS_DB_USER: "nids_app"
      NIDS_DB_PASSWORD: "${NIDS_DB_PASSWORD:?đặt trong .env}"
      NIDS_REDIS_HOST: "172.28.0.30"
      NIDS_REDIS_PASSWORD: "${NIDS_REDIS_PASSWORD:?đặt trong .env}"
    restart: unless-stopped

  # Honeypot chạy chung network với victim: NIDS sniff được cả traffic tới honeypot,
  # nên cùng một đòn vừa sinh cảnh báo rule vừa sinh sự kiện HONEYPOT.
  honeypot_ssh:
    image: hybrid-nids-app
    pull_policy: never
    container_name: nids_honeypot_ssh
    command: python -m nids.honeypot ssh
    network_mode: "service:victim_app"
    depends_on:
      mysql_db:
        condition: service_healthy
      victim_app:
        condition: service_started
    volumes:
      - .:/app
    environment: &nids_db_env
      NIDS_DB_HOST: "172.28.0.10"
      NIDS_DB_PORT: "3306"
      NIDS_DB_NAME: "nids_db"
      NIDS_DB_USER: "nids_app"
      NIDS_DB_PASSWORD: "${NIDS_DB_PASSWORD:?đặt trong .env}"
      NIDS_REDIS_HOST: "172.28.0.30"
      NIDS_REDIS_PASSWORD: "${NIDS_REDIS_PASSWORD:?đặt trong .env}"
    restart: unless-stopped

  honeypot_http:
    image: hybrid-nids-app
    pull_policy: never
    container_name: nids_honeypot_http
    command: python -m nids.honeypot http
    network_mode: "service:victim_app"
    depends_on:
      mysql_db:
        condition: service_healthy
      victim_app:
        condition: service_started
    volumes:
      - .:/app
    environment: *nids_db_env
    restart: unless-stopped

  # Chuyển hướng IP đáng ngờ (nhiều cảnh báo P1/P2) sang honeypot bằng iptables REDIRECT trong network của victim.
  # Không đặt restart: iptables không dùng được thì thoát mã 1; redirect.enabled: false thoát mã 0 (bình thường).
  nids_redirector:
    image: hybrid-nids-app
    pull_policy: never
    container_name: nids_redirector
    command: python -m nids.redirector
    network_mode: "service:victim_app"
    cap_add:
      - NET_ADMIN
    stop_grace_period: 10s
    depends_on:
      mysql_db:
        condition: service_healthy
      victim_app:
        condition: service_started
    volumes:
      - .:/app
    environment: *nids_db_env

  # API + dashboard chạy ở network namespace riêng (không chung với victim) để các request
  # của dashboard (poll dự phòng, WebSocket) không bị engine sniff nhầm thành lưu lượng cần phân tích.
  nids_api:
    image: hybrid-nids-app
    pull_policy: never
    container_name: nids_api
    command: uvicorn nids.api.main:app --host 0.0.0.0 --port 8000
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.20
    ports:
      - "8000:8000"
    depends_on:
      mysql_db:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      NIDS_DB_HOST: "172.28.0.10"
      NIDS_DB_PORT: "3306"
      NIDS_DB_NAME: "nids_db"
      NIDS_DB_USER: "nids_app"
      NIDS_DB_PASSWORD: "${NIDS_DB_PASSWORD:?đặt trong .env}"
      NIDS_REDIS_HOST: "172.28.0.30"
      NIDS_REDIS_PASSWORD: "${NIDS_REDIS_PASSWORD:?đặt trong .env}"
      # Khoá cho thao tác sửa rule trên web; đặt trong shell hoặc file .env, để trống thì trang Rules chỉ xem
      NIDS_API_KEY: "${NIDS_API_KEY:-}"
    restart: unless-stopped

  # Máy tấn công: image Kali riêng (nmap, hping3, hydra, ...), chạy
  #   docker exec -it nids_attacker python lab/attacker/attack_demo.py all
  attacker:
    build: ./lab/attacker
    container_name: nids_attacker
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.100
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: sleep infinity
