# Hybrid NIDS: mỗi tầng một nhóm service. Build từ gốc repo, mỗi service một Dockerfile trong services/<tên>/.
#   docker compose up --build                  # hệ thống (hạ tầng, thu thập, xử lý, dashboard, victim)
#   docker compose --profile lab up --build    # thêm máy tấn công để demo
networks:
  nids_isolated_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Biến kết nối CSDL và Redis dùng chung cho mọi service Python
x-nids-env: &nids_env
  NIDS_DB_HOST: "172.28.0.10"
  NIDS_DB_PORT: "3306"
  NIDS_DB_NAME: "nids_db"
  NIDS_DB_USER: "nids_app"
  NIDS_DB_PASSWORD: "${NIDS_DB_PASSWORD:?đặt trong .env}"
  NIDS_REDIS_HOST: "172.28.0.30"
  NIDS_REDIS_PASSWORD: "${NIDS_REDIS_PASSWORD:?đặt trong .env}"

# Service thu thập dùng chung network namespace với victim để sniff được traffic tới victim và honeypot
x-after-victim: &after_victim
  depends_on:
    mysql_db:
      condition: service_healthy
    victim_app:
      condition: service_started

services:
  # ── Hạ tầng ──────────────────────────────────────────────────────────────
  mysql_db:
    image: mysql:8.0
    container_name: nids_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?đặt trong .env}"
      MYSQL_DATABASE: nids_db
      MYSQL_USER: nids_app
      MYSQL_PASSWORD: "${NIDS_DB_PASSWORD:?đặt trong .env}"
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kênh đẩy tín hiệu "có cảnh báo mới" từ sensor/honeypot sang dashboard. Chỉ nằm trong mạng lab (không publish cổng ra host),
  # không lưu bền. Sensor vẫn chạy khi Redis chết nên các service không depends_on nó.
  redis:
    image: redis:7-alpine
    container_name: nids_redis
    command: redis-server --requirepass "${NIDS_REDIS_PASSWORD:?đặt trong .env}" --save "" --appendonly no
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.30
    restart: unless-stopped

  # ── Máy được bảo vệ ──────────────────────────────────────────────────────
  victim_app:
    build: ./lab/victim
    container_name: nids_victim
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.50

  # ── Thu thập (chung network namespace với victim) ─────────────────────────
  # Chỉ nids_sensor và honeypot_ssh có khối build; service khác dùng lại image (build song song dễ làm Docker Desktop sập).
  nids_sensor:
    build:
      context: .
      dockerfile: services/sensor/Dockerfile
    image: nids-sensor
    pull_policy: never
    container_name: nids_engine
    network_mode: "service:victim_app"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    <<: *after_victim
    volumes:
      - ./data/rules:/app/data/rules:ro
      - ./data/models:/app/data/models:ro
      - ./common/config:/app/common/config:ro
    environment: *nids_env
    restart: unless-stopped

  # Honeypot chạy chung network với victim: cùng một đòn vừa sinh cảnh báo rule vừa sinh sự kiện HONEYPOT.
  honeypot_ssh:
    build:
      context: .
      dockerfile: services/honeypot/Dockerfile
    image: nids-honeypot
    pull_policy: never
    container_name: nids_honeypot_ssh
    command: python -m nids.honeypot ssh
    network_mode: "service:victim_app"
    <<: *after_victim
    volumes:
      - ./common/config:/app/common/config:ro
      - ./data/work:/app/data/work          # giữ host key SSH giữa các lần chạy
    environment: *nids_env
    restart: unless-stopped

  honeypot_http:
    image: nids-honeypot
    pull_policy: never
    container_name: nids_honeypot_http
    command: python -m nids.honeypot http
    network_mode: "service:victim_app"
    <<: *after_victim
    volumes:
      - ./common/config:/app/common/config:ro
    environment: *nids_env
    restart: unless-stopped

  # Chuyển hướng IP đáng ngờ (nhiều cảnh báo P1/P2) sang honeypot bằng iptables REDIRECT trong network của victim.
  # Không đặt restart: iptables không dùng được thì thoát mã 1; redirect.enabled: false thoát mã 0 (bình thường).
  nids_redirector:
    build:
      context: .
      dockerfile: services/redirector/Dockerfile
    image: nids-redirector
    pull_policy: never
    container_name: nids_redirector
    network_mode: "service:victim_app"
    cap_add:
      - NET_ADMIN
    stop_grace_period: 10s
    <<: *after_victim
    volumes:
      - ./common/config:/app/common/config:ro
    environment: *nids_env

  # ── Trình bày ────────────────────────────────────────────────────────────
  # Dashboard chạy ở network namespace riêng (không chung với victim) để các request của dashboard
  # (poll dự phòng, WebSocket) không bị sensor sniff nhầm thành lưu lượng cần phân tích.
  nids_api:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    image: nids-dashboard
    pull_policy: never
    container_name: nids_api
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.20
    ports:
      - "8000:8000"
    depends_on:
      mysql_db:
        condition: service_healthy
    volumes:
      - ./data/rules:/app/data/rules          # trang Rules ghi trạng thái bật/tắt và custom.rules; sensor tự nạp lại
      - ./common/config:/app/common/config:ro
    environment:
      <<: *nids_env
      # Khoá cho thao tác sửa rule trên web; đặt trong shell hoặc file .env, để trống thì trang Rules chỉ xem
      NIDS_API_KEY: "${NIDS_API_KEY:-}"
    restart: unless-stopped

  # ── Lab (chỉ chạy khi demo: docker compose --profile lab up) ─────────────
  # Máy tấn công: image Kali riêng (nmap, hping3, hydra, ...), chạy
  #   docker exec -it nids_attacker python lab/attacker/attack_demo.py all
  attacker:
    profiles: ["lab"]
    build: ./lab/attacker
    container_name: nids_attacker
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.100
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./lab:/app/lab
      - ./common/core/src:/app/common/core/src:ro      # attack_demo.py dùng nids.logger
    stdin_open: true
    tty: true
    command: sleep infinity
