networks:
  nids_isolated_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  mysql_db:
    image: mysql:8.0
    container_name: nids_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "010305"
      MYSQL_DATABASE: nids_db
      MYSQL_USER: nids_app
      MYSQL_PASSWORD: "nids_app_password"
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p010305",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  victim_app:
    build: ./victim
    container_name: nids_victim
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.50

  nids_engine:
    build: .
    container_name: nids_engine
    network_mode: "service:victim_app"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      mysql_db:
        condition: service_healthy
      victim_app:
        condition: service_started
    volumes:
      - .:/app
    environment:
      NIDS_DB_HOST: "172.28.0.10"
      NIDS_DB_PORT: "3306"
      NIDS_DB_NAME: "nids_db"
      NIDS_DB_USER: "nids_app"
      NIDS_DB_PASSWORD: "nids_app_password"
    restart: unless-stopped

  # API + dashboard chạy ở network namespace riêng (không chung với victim) để các request
  # poll của dashboard không bị engine sniff nhầm thành lưu lượng cần phân tích.
  nids_api:
    build: .
    container_name: nids_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.20
    ports:
      - "8000:8000"
    depends_on:
      mysql_db:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      NIDS_DB_HOST: "172.28.0.10"
      NIDS_DB_PORT: "3306"
      NIDS_DB_NAME: "nids_db"
      NIDS_DB_USER: "nids_app"
      NIDS_DB_PASSWORD: "nids_app_password"
    restart: unless-stopped

  # Máy tấn công: image Kali riêng (nmap, hping3, hydra, ...), chạy
  #   docker exec -it nids_attacker python attacker/attack_demo.py all
  attacker:
    build: ./attacker
    container_name: nids_attacker
    networks:
      nids_isolated_net:
        ipv4_address: 172.28.0.100
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: sleep infinity
