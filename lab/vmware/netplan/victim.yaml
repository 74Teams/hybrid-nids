# VM Victim (Ubuntu) — chép thành /etc/netplan/50-lab.yaml rồi `sudo chmod 600` và `sudo netplan apply`.
# Tên card ở đây là ví dụ: kiểm tra bằng `ip -br link`.
network:
  version: 2
  ethernets:
    ens33:                      # VMnet3: nối tới IDS, gateway là IDS nên mọi traffic ra ngoài đều qua engine
      dhcp4: false
      addresses: [10.10.2.50/24]
      routes:
        - to: default
          via: 10.10.2.1
      nameservers:
        addresses: [8.8.8.8]
    ens34:                      # VMnet8 (NAT) TẠM, chỉ để docker build; xong thì ngắt card trong VMware
      dhcp4: true
      dhcp4-overrides:
        route-metric: 200       # đường ra Internet kém ưu tiên hơn gateway lab
