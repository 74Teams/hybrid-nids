# VM Victim (Ubuntu) — chép thành /etc/netplan/50-lab.yaml rồi `sudo chmod 600` và `sudo netplan apply`.
# Tên card ở đây là ví dụ: kiểm tra bằng `ip -br link`.
network:
  version: 2
  ethernets:
    ens33:                      # VMnet3: nối tới IDS
      dhcp4: false
      addresses: [10.10.2.50/24]
      routes:
        - to: default
          via: 10.10.2.1
          metric: 200           # card NAT tạm (DHCP, metric thấp hơn) thắng khi còn cắm; rút ra thì mọi traffic đi qua IDS
    ens34:                      # VMnet8 (NAT) TẠM: để git clone, cài Docker và docker build
      dhcp4: true
      optional: true            # không chặn lúc khởi động khi đã ngắt card
# Khi card NAT còn cắm, gói trả lời Kali cũng đi ra NAT chứ không qua IDS, nên Kali sẽ không ping được Victim.
# Trước khi kiểm tra/demo từ Kali: ngắt card NAT của Victim trong VMware (Settings → Network Adapter 2 → bỏ Connected).
