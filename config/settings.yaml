# HYBRID NIDS CONFIGURATION

system:
  env: "development"
  log_level: "INFO"

network:
  interface: "eth0"
  bpf_filter: "ip"
  promiscuous: true
  capture_mode: "live"
  pcap_file: "pcap_samples/demo_attacks.pcap"

detection:
  rules_dir: "rules"
  enable_rule_engine: true
  enable_ai_worker: true
  queue_max_size: 10000

database:
  # Doi type thanh "mysql" de dung MySQL, "sqlite" cho dev nhanh
  type: "mysql"
  host: "172.28.0.10"
  port: 3306
  user: "root"
  password: "010305"
  name: "nids_db"

api:
  host: "0.0.0.0"
  port: 8000
