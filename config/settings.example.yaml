# HYBRID NIDS CONFIGURATION

system:
  env: "development"
  log_level: "INFO"

network:
  interface: "eth0"
  # Loại port 3306: engine chạy chung network với victim nên sẽ thấy cả kết nối ghi alert vào MySQL,
  # nếu không loại thì nội dung câu INSERT (chứa chuỗi tấn công) lại sinh thêm alert.
  # Loại thêm kết nối tới Redis của lab (172.28.0.30:6379) vì là traffic nội bộ của chính hệ thống.
  bpf_filter: "ip and not port 3306 and not (host 172.28.0.30 and port 6379)"
  promiscuous: true
  capture_mode: "live"

detection:
  rules_dir: "rules"
  enable_rule_engine: true
  enable_ai_worker: true
  queue_max_size: 10000

flow:
  # Gom gói thành flow và ghi flow log vào bảng flows (mọi traffic, không chỉ traffic có cảnh báo)
  idle_timeout: 30        # giây không có gói thì flow kết thúc
  active_timeout: 120     # giây, flow sống lâu hơn thì cắt thành nhiều dòng
  closing_timeout: 2      # giây chờ ACK cuối sau FIN/RST trước khi xuất flow
  max_flows: 100000       # số flow giữ trong bộ nhớ; đầy thì đẩy flow cũ nhất ra
  batch_size: 500         # ghi CSDL khi gom đủ ngần này flow
  flush_interval: 5       # giây, hoặc khi quá thời gian này
  retention_hours: 24     # xoá flow cũ hơn ngần này giờ (0 = giữ mãi)

database:
  # Doi type thanh "mysql" de dung MySQL, "sqlite" cho dev nhanh
  type: "mysql"
  host: "172.28.0.10"
  port: 3306
  user: "nids_app"
  password: ""
  name: "nids_db"

redis:
  # Kênh đẩy cảnh báo thời gian thực tới dashboard. host rỗng = tắt, dashboard tự quay về poll.
  # Mật khẩu đặt qua biến môi trường NIDS_REDIS_PASSWORD (.env), không ghi vào file này.
  host: ""
  port: 6379
  password: ""

api:
  host: "0.0.0.0"
  port: 8000
